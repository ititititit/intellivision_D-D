
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dungeon Room Generator Test</title>
<style>
body {
    margin: 0;
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
}
#panel {
    padding: 16px;
    background: #1b1b1b;
    border-right: 1px solid #444;
    overflow: auto;
}
h2 { margin-top: 0; font-size: 18px; }
label { display: block; margin-top: 14px; }
input, button {
    width: 100%;
    box-sizing: border-box;
    background: #292929;
    color: #eee;
    border: 1px solid #555;
    padding: 8px;
    margin-top: 5px;
}
button { cursor: pointer; }
button:hover { background: #383838; }
#view { overflow: auto; padding: 20px; }
canvas { display: block; }
#status {
    margin-top: 18px;
    line-height: 1.7;
    white-space: pre-line;
}
small { color: #aaa; }
</style>
</head>
<body>

<div id="panel">
    <h2>Dungeon Generator</h2>

    <label>Width
        <input id="width" type="number" min="1" max="30" value="4">
    </label>
    <label>Height
        <input id="height" type="number" min="1" max="30" value="8">
    </label>
    <label>Seed
        <input id="seed" type="number" value="12345">
    </label>

    <button onclick="generate()">Generate</button>
    <button onclick="nextSeed()">Next Seed</button>

    <div id="status"></div>

    <p><small>
        Room number: 1–8<br>
        N/E/S/W: blocked direction<br>
        Gray: solid wall<br>
        Green: connected doorway<br>
        Red room: invalid exit count<br>
        Outer boundary: impassable
    </small></p>
</div>

<div id="view">
    <canvas id="canvas"></canvas>
</div>

<script>
"use strict";

/* =========================================================
   DUNGEON GENERATOR

   Public:
       generateDungeonRooms(width, height, seed)

   Each room:
       room: 1..8
       orientation: 0..3

   Orientation = blocked direction:
       0 NORTH
       1 EAST
       2 SOUTH
       3 WEST
========================================================= */

function generateDungeonRooms(width, height, seed) {

    width = Math.floor(width);
    height = Math.floor(height);

    if (width < 1 || height < 1)
        throw new Error("Invalid dungeon dimensions");

    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    let state = seed >>> 0;

    function random() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function inside(x, y) {
        return x >= 0 && y >= 0 &&
               x < width && y < height;
    }

    const orientations = Array.from(
        { length: height },
        () => Array(width).fill(-1)
    );

    function validOrientation(x, y, dir) {
        for (let d = 0; d < 4; d++) {
            const nx = x + DX[d];
            const ny = y + DY[d];

            if (!inside(nx, ny)) continue;

            const other = orientations[ny][nx];
            if (other === -1) continue;

            if ((dir === d) !==
                (other === ((d + 2) % 4)))
                return false;
        }
        return true;
    }

    function isConnected() {
        const visited = Array.from(
            { length: height },
            () => Array(width).fill(false)
        );

        const queue = [[0, 0]];
        visited[0][0] = true;
        let count = 0;

        for (let i = 0; i < queue.length; i++) {
            const [x, y] = queue[i];
            count++;

            for (let d = 0; d < 4; d++) {
                if (orientations[y][x] === d) continue;

                const nx = x + DX[d];
                const ny = y + DY[d];

                if (!inside(nx, ny) || visited[ny][nx])
                    continue;

                if (orientations[ny][nx] === ((d + 2) % 4))
                    continue;

                visited[ny][nx] = true;
                queue.push([nx, ny]);
            }
        }

        return count === width * height;
    }

    function solve(index) {
        if (index === width * height)
            return isConnected();

        const x = index % width;
        const y = Math.floor(index / width);

        for (const dir of shuffle([0, 1, 2, 3])) {
            if (!validOrientation(x, y, dir)) continue;

            orientations[y][x] = dir;

            if (solve(index + 1)) return true;

            orientations[y][x] = -1;
        }

        return false;
    }

    if (!solve(0))
        throw new Error("No valid dungeon found");

    return orientations.map(row =>
        row.map(orientation => ({
            room: 1 + Math.floor(random() * 8),
            orientation
        }))
    );
}

/* =========================================================
   VALIDATION
========================================================= */

function validateDungeon(grid) {
    const height = grid.length;
    const width = grid[0].length;

    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    const invalidRooms = [];
    let mismatches = 0;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const room = grid[y][x];
            let blockedCount = 0;

            for (let d = 0; d < 4; d++) {
                if (room.orientation === d)
                    blockedCount++;

                const nx = x + DX[d];
                const ny = y + DY[d];

                if (nx < 0 || ny < 0 ||
                    nx >= width || ny >= height)
                    continue;

                const other = grid[ny][nx];

                if ((room.orientation === d) !==
                    (other.orientation === ((d + 2) % 4)))
                    mismatches++;
            }

            if (blockedCount !== 1)
                invalidRooms.push({ x, y });
        }
    }

    return {
        invalidRooms,
        mismatches: mismatches / 2
    };
}

/* =========================================================
   TEST PAGE
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const TILE = 64;
const PAD = 20;

let dungeon = [];

function generate() {
    const width = Number(document.getElementById("width").value);
    const height = Number(document.getElementById("height").value);
    const seed = Number(document.getElementById("seed").value);

    try {
        dungeon = generateDungeonRooms(width, height, seed);

        const result = validateDungeon(dungeon);

        drawDungeon(result.invalidRooms);

        document.getElementById("status").textContent =
            "Rooms: " + width * height +
            "\nInvalid rooms: " + result.invalidRooms.length +
            "\nMismatched boundaries: " + result.mismatches +
            "\nConnectivity: guaranteed by generator" +
            "\nSeed: " + seed;
    }
    catch (error) {
        dungeon = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById("status").textContent =
            "Generation failed:\n" + error.message;
    }
}

function nextSeed() {
    const input = document.getElementById("seed");
    input.value = Number(input.value) + 1;
    generate();
}

/* =========================================================
   DRAW DUNGEON

   Each shared boundary is drawn only once.
========================================================= */

function drawDungeon(invalidRooms) {
    const height = dungeon.length;
    const width = dungeon[0].length;

    canvas.width = width * TILE + PAD * 2;
    canvas.height = height * TILE + PAD * 2;

    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {

            const room = dungeon[y][x];
            const px = PAD + x * TILE;
            const py = PAD + y * TILE;

            const invalid = invalidRooms.some(
                p => p.x === x && p.y === y
            );

            ctx.fillStyle = invalid ? "#602020" : "#292929";
            ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);

            ctx.textAlign = "center";
            ctx.fillStyle = "#eee";
            ctx.font = "bold 16px monospace";
            ctx.fillText(
                room.room,
                px + TILE / 2,
                py + TILE / 2
            );

            ctx.font = "11px monospace";
            ctx.fillStyle = "#aaa";
            ctx.fillText(
                ["N", "E", "S", "W"][room.orientation],
                px + TILE / 2,
                py + TILE / 2 + 16
            );
        }
    }

    // Draw vertical boundaries.
    for (let y = 0; y < height; y++) {
        for (let x = 0; x <= width; x++) {
            let blocked = true;

            if (x > 0 && x < width) {
                blocked = dungeon[y][x - 1].orientation === 1;
            }

            drawBoundary(
                PAD + x * TILE,
                PAD + y * TILE,
                true,
                blocked
            );
        }
    }

    // Draw horizontal boundaries.
    for (let y = 0; y <= height; y++) {
        for (let x = 0; x < width; x++) {
            let blocked = true;

            if (y > 0 && y < height) {
                blocked = dungeon[y - 1][x].orientation === 2;
            }

            drawBoundary(
                PAD + x * TILE,
                PAD + y * TILE,
                false,
                blocked
            );
        }
    }
}

function drawBoundary(x, y, vertical, blocked) {
    const gap = 20;

    ctx.strokeStyle = blocked ? "#aaa" : "#54d67a";
    ctx.lineWidth = blocked ? 4 : 3;
    ctx.beginPath();

    if (vertical) {
        if (blocked) {
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + TILE);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + (TILE-gap)/2);
            ctx.moveTo(x, y + (TILE+gap)/2);
            ctx.lineTo(x, y + TILE);
        }
    } else {
        if (blocked) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + TILE, y);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x + (TILE-gap)/2, y);
            ctx.moveTo(x + (TILE+gap)/2, y);
            ctx.lineTo(x + TILE, y);
        }
    }

    ctx.stroke();
}

generate();

</script>
</body>
</html>

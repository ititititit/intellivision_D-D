<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dungeon Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: #ddd;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 12px;
}

/* GAME CONTAINER */

#gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
    gap: 12px;
    margin: auto;
}

/* TITLE */

#gameTitle {
    margin: 0;
    padding: 8px 12px;
    color: #f5d446;
    font-family: Georgia, serif;
    font-size: clamp(24px, 5vw, 46px);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-align: center;
    text-transform: uppercase;
    text-shadow:
        2px 3px 0 #8b421a,
        0 0 20px #d57a2b55;
}

/* GAME DISPLAY */

#game {
    display: block;
    width: 100%;
    height: auto;
    flex-shrink: 0;
    background: #000;
    border: 2px solid #777;
    box-shadow: 0 0 24px #000;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
}

/* HELP OVERLAY */

#helpCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1000;
    display: none;
    border: none;
    box-shadow: none;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="gameContainer">
    <h1 id="gameTitle">Cloudy Mountain Quest</h1>

    <!-- Backing dimensions are set by dungeon_render.js. -->
    <canvas
        id="game"
        width="320"
        height="212"
        aria-label="Dungeon Explorer game"
    ></canvas>
</div>

<canvas id="helpCanvas"></canvas>

<!-- SOUND ENGINE -->
<script src="sound.js"></script>

<script>
"use strict";

/* DUNGEON CONFIGURATION */

const dungeonParams = new URLSearchParams(
    window.location.search
);

const requestedSeed = Number(
    dungeonParams.get("seed") ?? 12345
);

const GAME_SEED = Number.isSafeInteger(requestedSeed)
    ? requestedSeed
    : 12345;

const requestedColor = (
    dungeonParams.get("color") || "red"
).toLowerCase();

const GAME_DUNGEON_COLOR = [
    "red",
    "blue",
    "purple",
    "white"
].includes(requestedColor)
    ? requestedColor
    : "red";
</script>

<!-- HELP -->
<script src="dungeon_help.js"></script>

<!-- DUNGEON GENERATION -->
<script src="dungeon_room_extension.js"></script>
<script src="dungeon_visibility.js"></script>
<script src="dungeon_generator.js"></script>

<!-- DEFINITIONS -->
<script src="dungeon_placement.js"></script>
<script src="sprite_definitions.js"></script>
<script src="dungeon_definitions.js"></script>
<script src="room_definitions.js"></script>
<script src="dungeon_initialization.js"></script>
<script src="overworld_generator.js"></script>

<!-- WORLD AND CAMERA -->
<script src="dungeon_world.js"></script>
<script src="dungeon_camera.js"></script>

<!-- RENDERING -->
<script src="dungeon_render.js"></script>

<!-- INVENTORY -->
<script src="dungeon_inventory.js"></script>

<!-- PLAYER, PROJECTILES AND MONSTERS -->
<script src="dungeon_player.js"></script>
<script src="dungeon_projectiles.js"></script>
<script src="monster_movement.js"></script>
<script src="dungeon_entity_collision.js"></script>

<!-- AUDIO AND INPUT -->
<script src="dungeon_audio.js"></script>
<script src="dungeon_input.js"></script>

<!-- GAME INITIALIZATION -->
<script src="character_definitions.js"></script>
<script src="character.js"></script>
<script src="dungeon_game.js"></script>

<script>
"use strict";

/* FIT GAME TO WINDOW
   Changes CSS display size only.
   Never changes canvas.width or canvas.height.
*/

function fitGameDisplay() {
    const gameCanvas = document.getElementById("game");
    const title = document.getElementById("gameTitle");
    const container = document.getElementById("gameContainer");

    const availableWidth = Math.max(
        1,
        Math.min(800, container.clientWidth)
    );

    const availableHeight = Math.max(
        1,
        window.innerHeight -
        title.getBoundingClientRect().height -
        24 -
        12
    );

    // Account for the canvas's two-pixel border.
    const aspect = gameCanvas.width / gameCanvas.height;

    const widthForHeight =
        Math.max(1, availableHeight - 4) * aspect + 4;

    const displayWidth = Math.max(
        1,
        Math.floor(
            Math.min(availableWidth, widthForHeight)
        )
    );

    gameCanvas.style.width = displayWidth + "px";
}

window.addEventListener("resize", fitGameDisplay);
window.addEventListener("load", fitGameDisplay);

if (typeof ResizeObserver !== "undefined") {
    const gameLayoutObserver = new ResizeObserver(
        fitGameDisplay
    );

    gameLayoutObserver.observe(
        document.getElementById("gameTitle")
    );
}

fitGameDisplay();
</script>

</body>
</html>
